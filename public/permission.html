<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow — Enable Voice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D0D1A;
      color: #E2D9F3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #A855F7;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    p {
      font-size: 14px;
      color: #C7B8E8;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .enable-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2D1458, #4C1D95);
      border: 1px solid #6B2FD9;
      border-radius: 6px;
      color: #E2D9F3;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .enable-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #4C1D95, #6B2FD9);
      box-shadow: 0 0 12px #6B2FD940;
    }

    .enable-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status {
      margin-top: 18px;
      font-size: 13px;
      min-height: 18px;
      line-height: 1.5;
    }

    .status.success { color: #A855F7; }
    .status.error { color: #F87171; }
    .status.pending { color: #7C6B9E; }

    .close-btn {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      background: transparent;
      border: 1px solid #2D1458;
      border-radius: 6px;
      color: #7C6B9E;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-transform: uppercase;
      display: none;
    }

    .close-btn:hover {
      border-color: #6B2FD9;
      color: #C7B8E8;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="16" cy="28" rx="10" ry="3" fill="#6B2FD9" opacity="0.4"/>
      <path d="M10 24 L10 14 Q16 10 22 14 L22 24 Q16 27 10 24Z" fill="#1A0A2E" stroke="#6B2FD9" stroke-width="0.8"/>
      <ellipse cx="16" cy="12" rx="7" ry="8" fill="#0D0D1A" stroke="#6B2FD9" stroke-width="1"/>
      <ellipse cx="13" cy="11" rx="2" ry="1" fill="#A855F7" opacity="0.9"/>
      <ellipse cx="19" cy="11" rx="2" ry="1" fill="#A855F7" opacity="0.9"/>
    </svg>

    <h1>Enable Voice</h1>
    <p>Shadow needs your microphone to hear&nbsp;<strong>"Arise"</strong>&nbsp;and your voice commands. Grant access to summon it by voice.</p>

    <button class="enable-btn" id="enable-btn">Enable Voice</button>
    <div class="status" id="status"></div>
    <button class="close-btn" id="close-btn">Close Tab</button>
  </div>

  <script src="permission.js"></script>
</body>
</html>
